name: Validate Blender Extension

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.15.20
      - run: ruff check .

  windows-macos:
    name: Blender ${{ matrix.version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
        version: [5.0.0, 5.2.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download Blender for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '${{ matrix.version }}'
          $series = $version.Substring(0, 3)
          $archive = Join-Path $env:RUNNER_TEMP 'blender.zip'
          Invoke-WebRequest "https://download.blender.org/release/Blender$series/blender-$version-windows-x64.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'blender')
          $exe = Join-Path $env:RUNNER_TEMP "blender/blender-$version-windows-x64/blender.exe"
          "BLENDER_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Download Blender for macOS ARM64
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version='${{ matrix.version }}'
          series="${version%.*}"
          curl --fail --location --retry 3 "https://download.blender.org/release/Blender${series}/blender-${version}-macos-arm64.dmg" --output "$RUNNER_TEMP/blender.dmg"
          mkdir -p "$RUNNER_TEMP/blender-mount" "$RUNNER_TEMP/blender"
          hdiutil attach "$RUNNER_TEMP/blender.dmg" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/blender-mount"
          trap 'hdiutil detach "$RUNNER_TEMP/blender-mount"' EXIT
          ditto "$RUNNER_TEMP/blender-mount/Blender.app" "$RUNNER_TEMP/blender/Blender.app"
          echo "BLENDER_EXE=$RUNNER_TEMP/blender/Blender.app/Contents/MacOS/Blender" >> "$GITHUB_ENV"
      - name: Validate source, regressions and installed archive
        shell: bash
        run: python tests/platform_release_smoke.py --version '${{ matrix.version }}' --output "$RUNNER_TEMP/sdh-platform-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-${{ matrix.os }}-${{ matrix.version }}
          path: ${{ runner.temp }}/sdh-platform-results

  supported-versions:
    name: Blender ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 5.0 minimum
            version: 5.0.0
            url: https://download.blender.org/release/Blender5.0/blender-5.0.0-linux-x64.tar.xz
          - label: 5.2 current
            version: 5.2.0
            url: https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-${{ matrix.version }}
          key: blender-linux-x64-${{ matrix.version }}

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/blender-${{ matrix.version }}"
          curl --fail --location --retry 3 "${{ matrix.url }}" --output "${RUNNER_TEMP}/blender.tar.xz"
          tar --extract --xz --file "${RUNNER_TEMP}/blender.tar.xz" --strip-components=1 --directory "${RUNNER_TEMP}/blender-${{ matrix.version }}"

      - name: Compile Python
        run: python -m compileall -q .

      - name: Validate explicit cage dependencies
        run: python tests/dependency_contract.py

      - name: Validate translated report contracts
        run: python tests/cage_chain_translation_contract.py

      - name: Validate cage creation UI contract
        run: python tests/create_cage_ui_contract.py

      - name: Validate source manifest
        run: >-
          "${RUNNER_TEMP}/blender-${{ matrix.version }}/blender"
          --command extension validate .

      - name: Run Blender runtime regressions
        run: >-
          "${RUNNER_TEMP}/blender-${{ matrix.version }}/blender"
          --background --factory-startup --python-exit-code 1
          --python tests/runtime_regression.py

      - name: Run Cage Deform regressions
        run: >-
          "${RUNNER_TEMP}/blender-${{ matrix.version }}/blender"
          --background --factory-startup --python-exit-code 1
          --python tests/cage_deform_regression.py

      - name: Run legacy ownership and animation migration regressions
        shell: bash
        run: |
          blender="${RUNNER_TEMP}/blender-${{ matrix.version }}/blender"
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/legacy_lattice_origin_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/legacy_animation_migration_regression.py

      - name: Run unified deformation stack regression
        run: >-
          "${RUNNER_TEMP}/blender-${{ matrix.version }}/blender"
          --background --factory-startup --python-exit-code 1
          --python tests/unified_deform_stack_regression.py

      - name: Run deformation runtime lifecycle regression
        run: >-
          "${RUNNER_TEMP}/blender-${{ matrix.version }}/blender"
          --background --factory-startup --python-exit-code 1
          --python tests/deform_runtime_lifecycle_regression.py

      - name: Run animated cage cold-load regression
        run: >-
          "${RUNNER_TEMP}/blender-${{ matrix.version }}/blender"
          --background --factory-startup --python-exit-code 1
          --python tests/cage_load_runtime_regression.py

      - name: Run Curve cage feature regressions
        shell: bash
        run: |
          blender="${RUNNER_TEMP}/blender-${{ matrix.version }}/blender"
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/curve_radius_twist_preset_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/curve_cage_asset_regression.py

      - name: Run multi-layer and Cage Chain regressions
        shell: bash
        run: |
          blender="${RUNNER_TEMP}/blender-${{ matrix.version }}/blender"
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/cage_chain_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/chain_end_scale_scope_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/chain_preview_evaluator_sync_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/chain_prefix_parameter_sync_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/end_shape_drag_preview_freeze_regression.py

      - name: Run dedicated cage type regression
        run: >-
          "${RUNNER_TEMP}/blender-${{ matrix.version }}/blender"
          --background --factory-startup --python-exit-code 1
          --python tests/cage_type_regression.py

      - name: Run FFD lattice regression
        run: >-
          "${RUNNER_TEMP}/blender-${{ matrix.version }}/blender"
          --background --factory-startup --python-exit-code 1
          --python tests/ffd_lattice_regression.py

      - name: Run native FFD lifecycle regression
        run: >-
          "${RUNNER_TEMP}/blender-${{ matrix.version }}/blender"
          --background --factory-startup --python-exit-code 1
          --python tests/ffd_native_edit_regression.py

      - name: Run chained Origin and gap regressions
        shell: bash
        run: |
          blender="${RUNNER_TEMP}/blender-${{ matrix.version }}/blender"
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/mixed_chain_origin_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/subdivide_gap_profile_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/chain_domain_classification_probe.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/chain_physical_seam_probe.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/chain_root_origin_gap_alignment_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/chain_root_boundary_continuation_probe.py

      - name: Run multi-object deform merge regression
        run: >-
          "${RUNNER_TEMP}/blender-${{ matrix.version }}/blender"
          --background --factory-startup --python-exit-code 1
          --python tests/deform_merge_regression.py

      - name: Run registration conflict regression
        run: >-
          "${RUNNER_TEMP}/blender-${{ matrix.version }}/blender"
          --background --factory-startup --python-exit-code 1
          --python tests/registration_conflict_regression.py

      - name: Validate interface locale catalogs
        run: >-
          "${RUNNER_TEMP}/blender-${{ matrix.version }}/blender"
          --background --factory-startup --python-exit-code 1
          --python tests/translation_locale_contract.py

      - name: Run window-context undo regression
        shell: bash
        run: |
          result="${RUNNER_TEMP}/sdh-gui-undo-${{ matrix.version }}.txt"
          xvfb-run -a "${RUNNER_TEMP}/blender-${{ matrix.version }}/blender" --factory-startup --python tests/gui_undo_regression.py -- "$result"
          test "$(cat "$result")" = "PASS"

      - name: Run review interaction regressions
        shell: bash
        run: |
          xvfb-run -a python tests/platform_release_smoke.py \
            --blender "${RUNNER_TEMP}/blender-${{ matrix.version }}/blender" \
            --version '${{ matrix.version }}' --output "$RUNNER_TEMP/sdh-review-gui" \
            --gui-scripts native_shortcut_regression.py stack_preset_redo_regression.py \
            multi_window_display_smoke.py gui_modal_control_undo_regression.py \
            selection_event_runtime_regression.py ffd_native_undo_real_event_smoke.py \
            workspace_tool_cycle_regression.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-gui-linux-${{ matrix.version }}
          path: ${{ runner.temp }}/sdh-review-gui

      - name: Run legacy message-bus reload regression
        shell: bash
        env:
          BLENDER_USER_CONFIG: ${{ runner.temp }}/legacy-bus-config-${{ matrix.version }}
          BLENDER_USER_SCRIPTS: ${{ runner.temp }}/legacy-bus-scripts-${{ matrix.version }}
          BLENDER_USER_EXTENSIONS: ${{ runner.temp }}/legacy-bus-extensions-${{ matrix.version }}
          BLENDER_USER_DATAFILES: ${{ runner.temp }}/legacy-bus-datafiles-${{ matrix.version }}
        run: |
          mkdir -p "$BLENDER_USER_CONFIG" "$BLENDER_USER_SCRIPTS" "$BLENDER_USER_EXTENSIONS" "$BLENDER_USER_DATAFILES"
          result="${RUNNER_TEMP}/legacy-bus-${{ matrix.version }}.txt"
          xvfb-run -a "${RUNNER_TEMP}/blender-${{ matrix.version }}/blender" --factory-startup --python-exit-code 1 --python tests/legacy_msgbus_load_regression.py -- "$result"
          grep -q '^PASS::LEGACY_MSGBUS_LOAD' "$result"

      - name: Run FFD maximum-grid Gizmo draw smoke
        shell: bash
        run: |
          result="${RUNNER_TEMP}/sdh-ffd-gizmo-${{ matrix.version }}.txt"
          screenshot="${RUNNER_TEMP}/sdh-ffd-gizmo-${{ matrix.version }}.png"
          xvfb-run -a "${RUNNER_TEMP}/blender-${{ matrix.version }}/blender" --factory-startup --python tests/ffd_gizmo_draw_smoke.py -- "$result" "$screenshot"
          grep -q '^PASS' "$result"
          test -s "$screenshot"

      - name: Run first external cage box-select regression
        shell: bash
        run: |
          result="${RUNNER_TEMP}/sdh-first-box-select-${{ matrix.version }}.txt"
          xvfb-run -a "${RUNNER_TEMP}/blender-${{ matrix.version }}/blender" --factory-startup --python tests/first_external_box_select_regression.py -- "$result"
          test "$(cat "$result")" = "PASS::FIRST_EXTERNAL_BOX_SELECT"

      - name: Build release archive
        run: >-
          "${RUNNER_TEMP}/blender-${{ matrix.version }}/blender"
          --command extension build --source-dir .
          --output-filepath "${RUNNER_TEMP}/simple_deform_helper-${{ matrix.version }}.zip"

      - name: Validate release archive
        run: >-
          "${RUNNER_TEMP}/blender-${{ matrix.version }}/blender"
          --command extension validate
          "${RUNNER_TEMP}/simple_deform_helper-${{ matrix.version }}.zip"

      - name: Install and enable release archive
        shell: bash
        env:
          BLENDER_USER_CONFIG: ${{ runner.temp }}/sdh-config-${{ matrix.version }}
          BLENDER_USER_EXTENSIONS: ${{ runner.temp }}/sdh-extensions-${{ matrix.version }}
          BLENDER_USER_SCRIPTS: ${{ runner.temp }}/sdh-scripts-${{ matrix.version }}
          BLENDER_USER_DATAFILES: ${{ runner.temp }}/sdh-datafiles-${{ matrix.version }}
        run: |
          blender="${RUNNER_TEMP}/blender-${{ matrix.version }}/blender"
          repository="${RUNNER_TEMP}/sdh-repository-${{ matrix.version }}"
          mkdir -p "$repository" "$BLENDER_USER_CONFIG" "$BLENDER_USER_EXTENSIONS" "$BLENDER_USER_SCRIPTS" "$BLENDER_USER_DATAFILES"
          "$blender" --factory-startup --command extension repo-add sdh_test --name "SDH Test" --directory "$repository" --clear-all
          "$blender" --command extension install-file -r sdh_test -e "${RUNNER_TEMP}/simple_deform_helper-${{ matrix.version }}.zip"
          SDH_TEST_MODULE=bl_ext.sdh_test.simple_deform_helper "$blender" --background --python-exit-code 1 --python tests/deform_merge_regression.py
          SDH_TEST_MODULE=bl_ext.sdh_test.simple_deform_helper "$blender" --background --python-exit-code 1 --python tests/curve_radius_twist_preset_regression.py
          SDH_TEST_MODULE=bl_ext.sdh_test.simple_deform_helper "$blender" --background --python-exit-code 1 --python tests/curve_cage_asset_regression.py
          SDH_TEST_MODULE=bl_ext.sdh_test.simple_deform_helper "$blender" --background --python-exit-code 1 --python tests/unified_deform_stack_regression.py
          SDH_TEST_MODULE=bl_ext.sdh_test.simple_deform_helper "$blender" --background --python-exit-code 1 --python tests/deform_runtime_lifecycle_regression.py
          SDH_TEST_MODULE=bl_ext.sdh_test.simple_deform_helper "$blender" --background --python-exit-code 1 --python tests/cage_load_runtime_regression.py
          SDH_TEST_MODULE=bl_ext.sdh_test.simple_deform_helper "$blender" --background --python-exit-code 1 --python tests/chain_end_scale_scope_regression.py
          SDH_TEST_MODULE=bl_ext.sdh_test.simple_deform_helper "$blender" --background --python-exit-code 1 --python tests/chain_preview_evaluator_sync_regression.py
          "$blender" --background --python-exit-code 1 --python tests/installed_lifecycle.py

  next-blender:
    name: Blender next (allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Resolve official next build
        id: next
        shell: bash
        run: echo "url=$(python tests/resolve_blender_build.py)" >> "$GITHUB_OUTPUT"

      - name: Download next Blender
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/blender-next"
          curl --fail --location --retry 3 "${{ steps.next.outputs.url }}" --output "${RUNNER_TEMP}/blender-next.tar.xz"
          tar --extract --xz --file "${RUNNER_TEMP}/blender-next.tar.xz" --strip-components=1 --directory "${RUNNER_TEMP}/blender-next"

      - name: Validate, test, and build
        shell: bash
        run: |
          blender="${RUNNER_TEMP}/blender-next/blender"
          python tests/cage_chain_translation_contract.py
          python tests/create_cage_ui_contract.py
          "$blender" --command extension validate .
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/runtime_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/legacy_lattice_origin_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/legacy_animation_migration_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/cage_deform_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/unified_deform_stack_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/deform_runtime_lifecycle_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/cage_load_runtime_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/curve_radius_twist_preset_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/curve_cage_asset_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/cage_chain_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/chain_end_scale_scope_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/chain_preview_evaluator_sync_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/chain_prefix_parameter_sync_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/end_shape_drag_preview_freeze_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/cage_type_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/ffd_lattice_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/ffd_native_edit_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/deform_merge_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/registration_conflict_regression.py
          "$blender" --background --factory-startup --python-exit-code 1 --python tests/translation_locale_contract.py
          "$blender" --command extension build --source-dir . --output-filepath "${RUNNER_TEMP}/simple_deform_helper-next.zip"
          "$blender" --command extension validate "${RUNNER_TEMP}/simple_deform_helper-next.zip"
