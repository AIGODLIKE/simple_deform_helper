schema_version = "1.0.0"

blender_version_min = "5.0.0"
id = "simple_deform_helper"
license = ["SPDX:GPL-3.0-or-later", ]
maintainer = "ACGGIT"
name = "Simple Deform Helper"
tagline = "Easy to deform, easy to animate: keyable cage handles"
type = "add-on"
version = "2.7.50"
website = "https://github.com/AIGODLIKE/simple_deform_helper"
tags = ["3D View", "Modeling"]

[permissions]
files = "Save cage stack presets and export Alembic animation caches"

[build]
paths_exclude_pattern = [
    "__pycache__/",
    ".*",
    "*.zip",
    "*.blend1",
    "/tests/",
    "/README.md",
    "/README.en.md",
    "/README.ja_JP.md",
    "/README.ko_KR.md",
    "/README.zh_HANS.md",
    "/RELEASE_NOTES.md",
    "/src/image/",
    "/docs/",
    "/outputs/",
    "/validation_runtime/",
    "/audit/",
    "/matrix_*.json",
]
